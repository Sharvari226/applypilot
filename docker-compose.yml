services:
  db:
    image: pgvector/pgvector:pg16
    container_name: applypilot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: applypilot
      POSTGRES_PASSWORD: applypilot_dev_pw   # dev-only password, local container
      POSTGRES_DB: applypilot
    ports:
      - "5433:5432"
    volumes:
      - applypilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U applypilot -d applypilot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  applypilot_pgdata: